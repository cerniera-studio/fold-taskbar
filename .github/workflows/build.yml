name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Check the signing secret
        if: github.event_name != 'pull_request'
        env:
          CERNIERA_SIGNING_PASSWORD: ${{ secrets.CERNIERA_SIGNING_PASSWORD }}
        run: |
          if [ -z "$CERNIERA_SIGNING_PASSWORD" ]; then
            echo "::error::The org secret CERNIERA_SIGNING_PASSWORD is missing, so this build can't be signed with the app's key"
            exit 1
          fi

      - name: Build debug APK
        env:
          CERNIERA_SIGNING_PASSWORD: ${{ secrets.CERNIERA_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Surface compiler and Gradle errors as annotations, readable without the full log
          grep -E "^e: |What went wrong|^> [^T]|Could not|rror:" build.log | grep -v "^> Task" | head -10 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: FoldTaskbar-apk
          path: app/build/outputs/apk/debug/*.apk

      # Each build is published with the APK, so it installs from a plain link (and from Officina):
      # builds on main as releases, other branches as pre-releases to try before merging
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FoldTaskbar.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Fold Taskbar build ${{ github.run_number }}${{ github.ref != 'refs/heads/main' && format(' ({0})', github.ref_name) || '' }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          files: FoldTaskbar.apk
